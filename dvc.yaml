stages:
  visualize_data:
    desc: Genera las figuras exploratorias y los reportes sweetviz del escenario.
    cmd: .venv/bin/python src/data_visualization.py && .venv/bin/python src/data_report.py
    deps:
      - src/data_visualization.py
      - src/data_report.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - docs/figures/distribucion_sentimiento.png
      - docs/figures/longitud_resenas.png
      - docs/figures/correlaciones.png
      - docs/figures/servicio_postventa.png
      - docs/figures/tiempo_respuesta.png
      - docs/reporte_sweetviz.html
      - docs/reporte_sweetviz_negativo.html
      - docs/reporte_sweetviz_neutral.html
      - docs/reporte_sweetviz_positivo.html
  test_data_quality:
    cmd: pytest --html=docs/reporte_calidad_datos.html --self-contained-html test/test_data_quality.py -v || true
    deps:
      - test/test_data_quality.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - docs/reporte_calidad_datos.html
  prepare_data:
    desc: Limpia e integra clientes y reseñas en datos_integrados y genera el reporte de transformaciones.
    cmd: .venv/bin/python src/data_prep.py
    deps:
      - src/data_prep.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - data/processed/datos_integrados.csv
      - docs/reporte_transformaciones.html
  train_model:
    desc: Entrena el modelo final (LogisticRegression con los hiperparámetros seleccionados), lo registra en MLflow y guarda modelo, preprocesador, figuras y métricas.
    cmd: .venv/bin/python src/train_model.py
    deps:
      - src/train_model.py
      - src/data_prep.py
      - data/processed/datos_integrados.csv
    outs:
      - models/trained_model.pkl
      - models/preprocessor.pkl
      - docs/figures/confusion_matrix_test.png
      - docs/figures/roc_curve_test.png
    metrics:
      - metrics/train_metrics.json:
          cache: false
      - metrics/modelo_registrado.json:
          cache: false
  test_model:
    desc: Verifica el modelo entrenado (métricas, objetivo de negocio, línea base, fuga de datos y uso) y genera un reporte HTML.
    cmd: .venv/bin/python -m pytest --html=docs/reporte_test_modelo.html --self-contained-html test/test_train.py -v || true
    deps:
      - test/test_train.py
      - src/train_model.py
      - models/trained_model.pkl
      - metrics/train_metrics.json
      - data/processed/datos_integrados.csv
    outs:
      - docs/reporte_test_modelo.html

  promote_model:
    desc: Promueve la versión registrada en DagsHub al alias produccion si cumple el objetivo de negocio (accuracy >= 0.80).
    cmd: .venv/bin/python src/promote_model.py
    deps:
      - src/promote_model.py
      - metrics/train_metrics.json
      - metrics/modelo_registrado.json
      - docs/reporte_test_modelo.html
    metrics:
      - metrics/promocion.json:
          cache: false
